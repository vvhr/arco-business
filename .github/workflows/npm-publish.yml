name: Publish npm package

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  detect:
    name: Detect publish commit
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.commit-message.outputs.should_publish }}
    steps:
      - name: Check commit messages
        id: commit-message
        shell: bash
        run: |
          messages="$(jq -r '[.head_commit.message?, (.commits[]?.message?)] | map(select(. != null)) | join("\n")' "$GITHUB_EVENT_PATH")"

          if grep -Fq 'chore(publish)' <<< "$messages"; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Build and publish
    needs: detect
    if: ${{ needs.detect.outputs.should_publish == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          registry-url: https://registry.npmjs.org/

      - name: Setup pnpm
        run: |
          npm install --global pnpm@11.5.0
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Check package files
        run: pnpm prepack:check

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Resolve npm dist-tag
        id: package
        shell: bash
        run: |
          version="$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")"
          tag="latest"

          if [[ "$version" == *beta* ]]; then
            tag="beta"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing arco-business@$version with npm dist-tag: $tag"

      - name: Publish to npm
        run: npm publish --registry=https://registry.npmjs.org/ --access public --tag "${{ steps.package.outputs.tag }}" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
